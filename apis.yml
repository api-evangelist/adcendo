aid: adcendo
name: Adcendo
description: 'Adcendo ApS is a clinical-stage biopharmaceutical company headquartered
  in Copenhagen, Denmark, with US operations in Boston, Massachusetts, developing a
  new generation of antibody-drug conjugates (ADCs) for cancers with high unmet medical
  need. Founded in 2017 out of research by Lars Henning Engelholm and Niels Behrendt,
  the company advances a clinical and pre-clinical pipeline that includes ADCE-T02
  (targeting Tissue Factor, in the Phase 1b Tiffany-01 study across advanced solid
  tumors), ADCE-D01 (targeting uPARAP, granted FDA Fast Track designation for soft
  tissue sarcoma), and the pre-clinical ADCE-B05. Adcendo is a privately held,
  venture-backed therapeutics developer; it publishes a corporate website, pipeline
  and publications pages, and investor press releases, but it operates no developer
  program, public API, or machine-readable API contract.'
